# pr.chrisjowen.net → the app, with a Let's Encrypt certificate from cert-manager.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: pr-review
spec:
  redirectScheme: { scheme: https, permanent: true }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: pr-review
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: pr-review-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [pr.chrisjowen.net]
      secretName: pr-chrisjowen-net-tls
  rules:
    - host: pr.chrisjowen.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { name: http } }
